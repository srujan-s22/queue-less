apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: queueless
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: queueless-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi

