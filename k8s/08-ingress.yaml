apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: queueless-ingress
  namespace: queueless
  labels:
    app.kubernetes.io/name: queueless-ingress
    app.kubernetes.io/part-of: queueless-platform
spec:
  ingressClassName: traefik
  rules:
    - host: queueless.local
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5001
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000

