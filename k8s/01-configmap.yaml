apiVersion: v1
kind: ConfigMap
metadata:
  name: queueless-config
  namespace: queueless
  labels:
    app.kubernetes.io/name: queueless
    app.kubernetes.io/part-of: queueless-platform
data:
  NODE_ENV: "production"
  BACKEND_PORT: "5001"
  FRONTEND_PORT: "3000"
  MONGODB_URI: "mongodb://mongodb.queueless.svc.cluster.local:27017/queueless"
  CLIENT_URL: "http://queueless.local,http://localhost:3000,http://127.0.0.1:3000"
  JWT_EXPIRES_IN: "24h"
  POLL_INTERVAL_MS: "15000"

