apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: queueless
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: queueless-platform
spec:
  type: ClusterIP
  ports:
    - port: 5001
      targetPort: 5001
      name: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: queueless
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: queueless-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: queueless-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: queueless-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: http
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: queueless-config
                  key: BACKEND_PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: queueless-config
                  key: NODE_ENV
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: queueless-config
                  key: MONGODB_URI
            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: queueless-config
                  key: CLIENT_URL
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: queueless-config
                  key: JWT_EXPIRES_IN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: queueless-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 400m
              memory: 400Mi
          startupProbe:
            httpGet:
              path: /
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5001
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5001
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

